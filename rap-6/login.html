<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
<title>Login Rap</title>

<h1>Acesso Administrativo</h1>

<div class="Musica">
    <h3>Login</h3>
    <input type="text" id="user" placeholder="Usuário" style="width: 80%; margin: 5px; padding: 5px;">
    <input type="password" id="pass" placeholder="Senha" style="width: 80%; margin: 5px; padding: 5px;">
    <button onclick="logar()">Entrar</button>
</div>

<a href="index.html">Voltar</a>

<script>
function logar() {
    var u = document.getElementById('user').value;
    var s = document.getElementById('pass').value;

    if (u == "adm" && s == "1234") {
        alert("Bem-vindo, " + u);
    } else {
        alert("Acesso negado");
    }
}
</script>

</body>
</html>
